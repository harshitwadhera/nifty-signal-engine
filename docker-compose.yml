name: nifty-signal-engine
services:
  signal-engine:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      MARKET_DB_PATH: /app/data/market.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --no-access-log
      - --proxy-headers
      - --forwarded-allow-ips
      - "${PROXY_TRUSTED_IPS:-127.0.0.1}"
    stop_grace_period: 4m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
